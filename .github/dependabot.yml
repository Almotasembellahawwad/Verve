version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
      development-minor:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Runtime and its type surface move together through an explicit platform upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next does not yet support ESLint 10's rule-context API.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Verve consumes the TypeScript Compiler API. TypeScript 7 intentionally
      # ships without it, so migration requires the official side-by-side TS6/7 setup.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
